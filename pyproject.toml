[project]
name = "finm37000-grp2"
version = "0.1.0"
description = "FINM 37000 Group 2 project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "databento",
    "matplotlib>=3.11.2",
    "pandas",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finm37000_grp2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
